<html>
    <head>

        <meta charset="UTF-8">
        <title> Produto 2 Irmãos </title>
        <link rel="stylesheet" href="estiloso.css">

    </head>
    <body>
        <h1 style="text-align: center;
        font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        height: 60px;
        color:rgb(31, 28, 30) ;
        margin-top: 20px;
        "> 🙀  Estoque 2 Irmãos 🙀</h1>

        <form method="post" action="produtos.php">

            <fieldset class="card">
                <h2 class="cont_title"> Cadastro de Produtos 👍 </h2> 

            <div class="form-grid">

        
                <div class="campo">
                    <label> Nome do Produto: </label>
                    <input type="text" placeholder="''goiaba''" name="nome_produto" required>
                </div>  
            
                <div class="campo">
                    <label> Categoria: </label>
                    <select name="categoria" required> 
                    <option value="" disabled selected> Selecione uma categoria...</option>
                    <option value="alimento"> Alimento</option>
                    <option value="acessorio"> Acessório</option>
                    <option value="eletronicos"> Eletronicos</option>
                    <option value="roupas"> Roupas</option>
                    <option value="outros"> Outros</option>
                    </select>
                </div>

                <div class="campo">
                    <label> Valor Compra: </label>
                    <input type="number" step="0.01" placeholder="0.00" name="valor_compra">
                </div>

                <div class="campo">
                    <label> Valor Venda: </label>
                    <input type="number" step="0.01" placeholder="0.00" name="valor_venda">
                </div>

                <div class="campo campo-estoque">
                    <label> Qtd. Estoque: </label>
                    <input type="number" placeholder="0" name="qtd_estoque">
                </div>

            
                <div class="buttons">
                    <input type="submit" value="Cadastrar produto" class="btn"> 
                    <input type="submit" value="Vender produto" class="btn">
                </div>
            
            </div>
            <br>

            <h2 class="cont_title"> 🤯 Estoque </h2> 

            <div class="campo"> 
            <table class="table">
                <thead>
                <tr>
                    <th> Descrição </th>
                    <th> Categoria </th>
                    <th> Venda </th>
                    <th> Lucro Unit. </th>
                    <th> Estoque </th>
                    <th> Ações </th>
                </tr>
                </thead>
                <tbody>

                </tbody>
            </table>
            </div>
            </fieldset>
        </form>
    </body>
</html>
